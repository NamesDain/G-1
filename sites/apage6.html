<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../liquid-glass.css">
    <link rel="stylesheet" href="s6.style.css">
    <title>Booking Confirmed - CinePlex</title>
</head>
<body>
    <nav class="glass-nav">
        <div class="nav-container">
            <a href="../index.html" class="logo">CinePlex</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="ahome.index.html" class="active">Movies</a>
                <a href="../about.html">About</a>
                <a href="../contact.html">Contact</a>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="confirmation-container">
        <div class="screen-card">
            <div class="screen-header success">Booking Confirmed</div>
            <div class="screen-body">
                <div class="success-message">
                    <div class="success-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <h2>You're all set!</h2>
                    <p>Please show your QR code at the entry</p>
                </div>

                <div class="ticket glass-panel">
                    <div class="ticket-header">
                        <span class="booking-id">Booking #XYZ7890</span>
                    </div>
                    
                    <div class="ticket-divider"></div>
                    
                    <div class="ticket-details">
                        <div class="detail-row">
                            <span class="label">Movie</span>
                            <span class="value">Iron Man</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Showtime</span>
                            <span class="value">10:00 PM</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Seats</span>
                            <span class="value">B3, B4</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Ticket Type</span>
                            <span class="value">Full Price</span>
                        </div>
                    </div>

                    <div class="qr-section">
                        <div class="qr-code">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=CINEPLEX-BOOKING-XYZ7890" alt="Booking QR Code" style="border: 8px solid white; border-radius: 10px;">
                        </div>
                        <p class="qr-hint">Scan this code for entry</p>
                    </div>
                </div>

                <div class="actions">
                    <a href="../index.html" class="btn-glass btn-primary btn-full">Back to Home</a>
                    <a href="ahome.index.html" class="btn-glass btn-secondary btn-full">Browse More Movies</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
