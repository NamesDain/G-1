<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../liquid-glass.css">
    <link rel="stylesheet" href="s2.style.css">
    <title>Shrek - CinePlex</title>
</head>
<body>
    <nav class="glass-nav">
        <div class="nav-container">
            <a href="../index.html" class="logo">CinePlex</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="ahome.index.html" class="active">Movies</a>
                <a href="../about.html">About</a>
                <a href="../contact.html">Contact</a>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="movie-detail-container">
        <div class="screen-card">
            <div class="screen-header">Movie Details</div>
            <div class="screen-body">
                <div class="movie-info-detail">
                    <div class="movie-thumb">
                        <img src="zpic5movie.jpg" alt="Shrek">
                    </div>
                    <div class="info-text">
                        <h2>Shrek</h2>
                        <div class="meta-tags">
                            <span class="glass-chip">PG</span>
                            <span class="glass-chip">Animation/Comedy</span>
                        </div>
                        <p class="duration">Duration: 1h 30m</p>
                    </div>
                </div>
                
                <div class="showtimes-section">
                    <h3>Select Showtime</h3>
                    <div class="showtime-grid">
                        <a href="apage3.html" class="showtime-btn">10:00 AM</a>
                        <a href="apage3.html" class="showtime-btn">12:30 PM</a>
                        <a href="apage3.html" class="showtime-btn">07:30 PM</a>
                        <a href="apage3.html" class="showtime-btn">09:00 PM</a>
                    </div>
                </div>

                <div class="actions">
                    <a href="ahome.index.html" class="btn-glass btn-secondary btn-full">Back to Movies</a>
                </div>
            </div>
        </div>
    </div>












<script src="../script.js"></script>
</body>
</html>
