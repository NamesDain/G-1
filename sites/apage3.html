<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../liquid-glass.css">
    <link rel="stylesheet" href="s3.style.css">
    <title>Select Seats - CinePlex</title>
</head>
<body>
    <nav class="glass-nav">
        <div class="nav-container">
            <a href="../index.html" class="logo">CinePlex</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="ahome.index.html" class="active">Movies</a>
                <a href="../about.html">About</a>
                <a href="../contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <div class="seat-selection-container">
        <div class="screen-card">
            <div class="screen-header">Select Your Seats</div>
            <div class="screen-body">
                <div class="legend">
                    <div class="legend-item"><div class="box available"></div> Available</div>
                    <div class="legend-item"><div class="box booked"></div> Booked</div>
                    <div class="legend-item"><div class="box selected"></div> Selected</div>
                </div>

                <div class="screen-display">

                    <span class="screen-label">SCREEN</span>
                </div>

                <div class="seats-container">

                    <label for="s1" class="seat-label"></label>

                    <input type="checkbox" id="s2" class="seat-checkbox">

                    <input type="checkbox" id="s3" class="seat-checkbox">
                    <label for="s3" class="seat-label"></label>

                    <input type="checkbox" id="s4" class="seat-checkbox">
                    <label for="s4" class="seat-label"></label>

                    <input type="checkbox" id="s5" class="seat-checkbox" disabled>
                    <label for="s5" class="seat-label"></label>

                    <input type="checkbox" id="s6" class="seat-checkbox">
                    <label for="s6" class="seat-label"></label>

                    <input type="checkbox" id="s7" class="seat-checkbox">
                    <label for="s7" class="seat-label"></label>

                    <input type="checkbox" id="s8" class="seat-checkbox">
                    <label for="s8" class="seat-label"></label>

                    <input type="checkbox" id="s9" class="seat-checkbox">
                    <label for="s9" class="seat-label"></label>

                    <input type="checkbox" id="s10" class="seat-checkbox">
                    <label for="s10" class="seat-label"></label>

                    <input type="checkbox" id="s11" class="seat-checkbox">
                    <label for="s11" class="seat-label"></label>

                    <input type="checkbox" id="s12" class="seat-checkbox">
                    <label for="s12" class="seat-label"></label>

                    <input type="checkbox" id="s13" class="seat-checkbox">
                    <label for="s13" class="seat-label"></label>

                    <input type="checkbox" id="s14" class="seat-checkbox" disabled>
                    <label for="s14" class="seat-label"></label>

                    <input type="checkbox" id="s15" class="seat-checkbox">
                    <label for="s15" class="seat-label"></label>

                    <input type="checkbox" id="s16" class="seat-checkbox" disabled>
                    <label for="s16" class="seat-label"></label>

                    <input type="checkbox" id="s17" class="seat-checkbox">
                    <label for="s17" class="seat-label"></label>

                    <input type="checkbox" id="s18" class="seat-checkbox">
                    <label for="s18" class="seat-label"></label>

                    <input type="checkbox" id="s19" class="seat-checkbox">
                    <label for="s19" class="seat-label"></label>

                    <input type="checkbox" id="s20" class="seat-checkbox">
                    <label for="s20" class="seat-label"></label>

                    <input type="checkbox" id="s21" class="seat-checkbox">
                    <label for="s21" class="seat-label"></label>

                    <input type="checkbox" id="s22" class="seat-checkbox">
                    <label for="s22" class="seat-label"></label>

                    <input type="checkbox" id="s23" class="seat-checkbox">
                    <label for="s23" class="seat-label"></label>

                    <input type="checkbox" id="s24" class="seat-checkbox">
                    <label for="s24" class="seat-label"></label>

                    <input type="checkbox" id="s25" class="seat-checkbox">
                    <label for="s25" class="seat-label"></label>

                    <input type="checkbox" id="s26" class="seat-checkbox">
                    <label for="s26" class="seat-label"></label>

                    <input type="checkbox" id="s27" class="seat-checkbox" disabled>
                    <label for="s27" class="seat-label"></label>

                    <input type="checkbox" id="s28" class="seat-checkbox">
                    <label for="s28" class="seat-label"></label>

                    <input type="checkbox" id="s29" class="seat-checkbox">
                    <label for="s29" class="seat-label"></label>

                    <input type="checkbox" id="s30" class="seat-checkbox">
                    <label for="s30" class="seat-label"></label>
                </div>

                <div class="summary glass-panel">
                    <div class="summary-item">
                        <span>Movie Ticket x <span class="count-number">0</span></span>
                        <span class="item-price">₱0</span>
                    </div>
                    <div class="summary-item">
                        <span>Service Fee</span>
                        <span class="service-fee">₱50</span>
                    </div>
                    <div class="summary-total">
                        <span>Total Price:</span>
                        <span class="total-price">₱0</span>
                    </div>
                </div>

                <div class="actions">
                    <button id="continueBtn" class="btn-glass btn-primary btn-full">Continue to Booking</button>
                    <a href="ahome.index.html" class="btn-glass btn-secondary btn-full">Back to Movies</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        const seatCheckboxes = document.querySelectorAll('.seat-checkbox');
        const countNumber = document.querySelector('.count-number');
        const itemPriceDisp = document.querySelector('.item-price');
        const totalPriceDisp = document.querySelector('.total-price');
        const continueBtn = document.getElementById('continueBtn');
        
        const moviePrice = parseInt(sessionStorage.getItem('currentMoviePrice') || '300');
        const serviceFee = 50;

        function updateSummary() {
            const selectedSeats = Array.from(seatCheckboxes).filter(cb => cb.checked).length;
            countNumber.textContent = selectedSeats;
            
            const ticketsPrice = selectedSeats * moviePrice;
            itemPriceDisp.textContent = `₱${ticketsPrice}`;
            
            const total = selectedSeats > 0 ? (ticketsPrice + serviceFee) : 0;
            totalPriceDisp.textContent = `₱${total}`;
            
            sessionStorage.setItem('selectedSeatsCount', selectedSeats);
            sessionStorage.setItem('totalPrice', total);
        }

        seatCheckboxes.forEach(cb => {
            cb.addEventListener('change', updateSummary);
        });

        continueBtn.addEventListener('click', () => {
            const selectedSeats = Array.from(seatCheckboxes).filter(cb => cb.checked).length;
            if (selectedSeats === 0) {
                alert('Please select at least 1 seat');
            } else {
                window.location.href = 'apage4.html';
            }
        });

        updateSummary();
    </script>
</body>
</html>
