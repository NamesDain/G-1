<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../liquid-glass.css">
    <link rel="stylesheet" href="s.style.css">
    <title>Browse Movies - CinePlex</title>
</head>
<body>
    <nav class="glass-nav">
        <div class="nav-container">
            <a href="../index.html" class="logo">CinePlex</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="ahome.index.html" class="active">Movies</a>
                <a href="../about.html">About</a>
                <a href="../contact.html">Contact</a>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <div class="section-header">
            <h1>Now Showing</h1>
            <p>Select a movie to view showtimes and book tickets</p>
        </div>

        <div class="movie-grid">
            <div class="movie-card glass-card" onclick="sessionStorage.setItem('currentMoviePrice', '350'); window.location.href='apage2.html'">
                <div class="poster">
                    <img src="zpic6movie.jpg" alt="Iron Man">
                    <div class="price-tag">₱350</div>
                </div>
                <div class="movie-info">
                    <h3>Iron Man</h3>
                    <div class="movie-meta">
                        <span class="rating">8.8</span>
                        <span class="glass-chip">Action</span>
                    </div>
                </div>
            </div>

            <div class="movie-card glass-card" onclick="sessionStorage.setItem('currentMoviePrice', '400'); window.location.href='dmovie.html'">
                <div class="poster">
                    <img src="zpicgundam.jpg" alt="Gundam">
                    <div class="price-tag">₱400</div>
                </div>
                <div class="movie-info">
                    <h3>Gundam: Requiem for Vengeance</h3>
                    <div class="movie-meta">
                        <span class="rating">8.5</span>
                        <span class="glass-chip">Sci-Fi</span>
                    </div>
                </div>
            </div>

            <div class="movie-card glass-card" onclick="sessionStorage.setItem('currentMoviePrice', '450'); window.location.href='edmovie.html'">
                <div class="poster">
                    <img src="zpicstellar.jpg" alt="Interstellar">
                    <div class="price-tag">₱450</div>
                </div>
                <div class="movie-info">
                    <h3>Interstellar</h3>
                    <div class="movie-meta">
                        <span class="rating">8.7</span>
                        <span class="glass-chip">Sci-Fi</span>
                    </div>
                </div>
            </div>

            <div class="movie-card glass-card" onclick="sessionStorage.setItem('currentMoviePrice', '300'); window.location.href='fdmovie.html'">
                <div class="poster">
                    <img src="zpic5movie.jpg" alt="Shrek">
                    <div class="price-tag">₱300</div>
                </div>
                <div class="movie-info">
                    <h3>Shrek</h3>
                    <div class="movie-meta">
                        <span class="rating">7.9</span>
                        <span class="glass-chip">Animation</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <p><i class="fa-regular fa-copyright"></i> 2024 CinePlex. All rights reserved.</p>
            <div class="footer-links">
                <a href="../about.html"><i class="fa-solid fa-circle-info"></i> About</a>
                <a href="../contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
            </div>
        </div>
    </footer>
</body>
</html>
